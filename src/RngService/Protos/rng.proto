syntax = "proto3";

package ginbet.rng_service.v1;
option csharp_namespace = "Ginbet.RngService.V1";

service RngGenerator {
  rpc PrepareRound (PrepareRoundRequest) returns (PrepareRoundResponse);

  rpc RollDice (RollDiceRequest) returns (RollDiceResponse);
}

message PrepareRoundRequest {}

message PrepareRoundResponse {
  string server_seed = 1;
  string server_seed_hash = 2;
}

message RollDiceRequest {
  string server_seed = 1;
  string client_seed1 = 2;
  string client_seed2 = 3;
  int32 nonce = 4;
  string step_tag = 5;
  int32 dice_count = 6;
  int32 dice_sides = 7;
}

message RollDiceResponse {
  repeated int32 rolls = 1;
  repeated string hmac_hashes = 2;
}